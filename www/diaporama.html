<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Diaporama - Dropfile KXKM</title>
    <link rel="stylesheet" href="diaporama.css">
</head>
<body>

    <!-- Landing: parameters + folder selection -->
    <div id="landing">
        <h1>Diaporama</h1>

        <div id="params">
            <label for="duration">Durée par image (secondes):</label>
            <input type="number" id="duration" value="5" min="1" max="120" step="1">
        </div>

        <h2>Choisir un dossier</h2>
        <ul id="folderList"></ul>
    </div>

    <!-- Diaporama player -->
    <div id="player" class="hidden">
        <div id="mediaContainer">
            <img id="imgDisplay" class="media hidden" />
            <video id="vidDisplay" class="media hidden" autoplay muted></video>
        </div>
        <div id="counter"></div>
        <div id="freshIndicator" class="hidden">★ NEW</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="diaporama.js"></script>
</body>
</html>
