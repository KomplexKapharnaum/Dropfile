<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropfile · Admin</title>
    <link rel="stylesheet" href="/admin/admin.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="/midi.js"></script>
    <script src="/admin/admin.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body>
<div id="app" x-data="adminApp()" x-init="init()"
     @keydown.window.arrow-right="lightbox.open && lbNext()"
     @keydown.window.arrow-left="lightbox.open && lbPrev()"
     @keydown.window.escape="lightbox.open ? lbClose() : (mediaModal.open ? closeMediaModal() : (share.open && closeShare()))">

    <input type="file" multiple x-ref="fileInput" @change="onUpload($event)" style="display:none">

    <header class="topbar">
        <div class="brand">
            <span class="logo" @click="goProjects()">Dropfile</span>
            <template x-if="view==='workspace' && project()">
                <span class="crumb"><span class="sep">/</span> <span x-text="project().name"></span></span>
            </template>
        </div>
        <nav class="tabs">
            <button :class="{active: view==='projects'}" @click="goProjects()">Projects</button>
            <button :class="{active: view==='players'}" @click="goPlayers()">Players</button>
            <a class="tablink" href="/diag" target="_blank">WebRTC ↗</a>
        </nav>
    </header>

    <div class="toast" x-show="toast" x-text="toast" x-cloak></div>

    <!-- ===================== LANDING: PROJECTS ===================== -->
    <main x-show="view==='projects'" x-cloak>
        <div class="page-head">
            <h1>Projects</h1>
            <button class="primary" @click="createProject()"><span x-html="icon('plus')"></span> Project</button>
        </div>
        <div class="cards">
            <template x-for="p in projects" :key="p.id">
                <div class="pcard" @click="openProject(p)">
                    <h2 x-text="p.name"></h2>
                    <div class="pcard-meta">
                        <span x-text="p.sceneCount + (p.sceneCount===1?' scene':' scenes')"></span>
                        <span x-text="p.mediaCount + (p.mediaCount===1?' media':' medias')"></span>
                        <span x-text="(p.players||[]).length + ' players'"></span>
                    </div>
                </div>
            </template>
            <p class="muted" x-show="projects.length===0">No projects yet — create one.</p>
        </div>
    </main>

    <!-- ===================== PLAYERS POOL ===================== -->
    <main x-show="view==='players'" x-cloak>
        <div class="page-head">
            <h1>Players <span class="muted">· display surfaces</span></h1>
            <button class="primary" @click="createPlayer()"><span x-html="icon('plus')"></span> Player</button>
        </div>

        <template x-for="pl in players" :key="pl.id">
            <section class="card" :data-player="pl.id">
                <div class="card-head">
                    <div class="title-wrap">
                        <h2 x-text="pl.name"></h2>
                        <button class="iconbtn" title="Rename" @click="renamePlayer(pl)" x-html="icon('pencil')"></button>
                    </div>
                    <div class="actions">
                        <button class="iconbtn" title="Share display URL" @click="openShare(playerUrl(pl), pl.name)" x-html="icon('share')"></button>
                        <button class="iconbtn danger" title="Delete player" @click="deletePlayer(pl)" x-html="icon('trash')"></button>
                    </div>
                </div>

                <div class="player-config">
                    <fieldset class="settings">
                        <legend>Auto-play</legend>
                        <p class="muted hint">Mode (manual vs auto-play) is set live from a workspace's control room.</p>
                        <label class="field inline"><span>Duration (s)</span>
                            <input type="number" min="1" step="1" x-model.number="pl.settings.imageDuration" @change="saveSettings(pl)"></label>
                        <label class="field inline"><span>Loop</span>
                            <select x-model="pl.settings.loop" @change="saveSettings(pl)"><option value="all">all media</option><option value="lastX">last X</option></select>
                            <input class="xnum" type="number" min="1" step="1" x-show="pl.settings.loop==='lastX'" x-model.number="pl.settings.lastX" @change="saveSettings(pl)"></label>
                        <label class="chk"><input type="checkbox" x-model="pl.settings.prioritizeFresh" @change="saveSettings(pl)"> prioritise fresh uploads</label>
                    </fieldset>

                    <fieldset class="settings">
                        <legend>Surface / LED scaler</legend>
                        <label class="field inline"><span>Container</span>
                            <select x-model="pl.settings.scaler.container" @change="saveSettings(pl)"><option value="full">full screen</option><option value="custom">custom resolution</option></select></label>
                        <div class="subgroup" x-show="pl.settings.scaler.container==='custom'" x-cloak>
                            <div class="subtitle">Custom resolution — exact pixels on screen</div>
                            <div class="row">
                                <label class="field inline narrow"><span>W</span><input type="number" min="0" x-model.number="pl.settings.scaler.width" @change="saveSettings(pl)"></label>
                                <label class="field inline narrow"><span>H</span><input type="number" min="0" x-model.number="pl.settings.scaler.height" @change="saveSettings(pl)"></label>
                            </div>
                            <div class="field"><span>Offset X</span><div class="radios">
                                <label><input type="radio" :name="'px'+pl.id" value="left" x-model="pl.settings.scaler.posX" @change="saveSettings(pl)"> left</label>
                                <label><input type="radio" :name="'px'+pl.id" value="center" x-model="pl.settings.scaler.posX" @change="saveSettings(pl)"> center</label>
                                <label><input type="radio" :name="'px'+pl.id" value="right" x-model="pl.settings.scaler.posX" @change="saveSettings(pl)"> right</label>
                                <label><input type="radio" :name="'px'+pl.id" value="custom" x-model="pl.settings.scaler.posX" @change="saveSettings(pl)"> px</label>
                                <input class="xnum" type="number" x-show="pl.settings.scaler.posX==='custom'" x-model.number="pl.settings.scaler.offsetX" @change="saveSettings(pl)">
                            </div></div>
                            <div class="field"><span>Offset Y</span><div class="radios">
                                <label><input type="radio" :name="'py'+pl.id" value="top" x-model="pl.settings.scaler.posY" @change="saveSettings(pl)"> top</label>
                                <label><input type="radio" :name="'py'+pl.id" value="center" x-model="pl.settings.scaler.posY" @change="saveSettings(pl)"> center</label>
                                <label><input type="radio" :name="'py'+pl.id" value="bottom" x-model="pl.settings.scaler.posY" @change="saveSettings(pl)"> bottom</label>
                                <label><input type="radio" :name="'py'+pl.id" value="custom" x-model="pl.settings.scaler.posY" @change="saveSettings(pl)"> px</label>
                                <input class="xnum" type="number" x-show="pl.settings.scaler.posY==='custom'" x-model.number="pl.settings.scaler.offsetY" @change="saveSettings(pl)">
                            </div></div>
                        </div>
                        <label class="field inline"><span>Fit</span>
                            <select x-model="pl.settings.scaler.fit" @change="saveSettings(pl)"><option value="contain">contain</option><option value="cover">cover</option></select></label>
                        <label class="field inline"><span>Rotation</span>
                            <select x-model.number="pl.settings.scaler.rotation" @change="saveSettings(pl)"><option :value="0">0°</option><option :value="90">90°</option><option :value="180">180°</option><option :value="270">270°</option></select></label>
                        <label class="chk"><input type="checkbox" x-model="pl.settings.scaler.evenLineSuppression" @change="saveSettings(pl)"> even-line squash (vertical 50%)</label>
                    </fieldset>

                    <fieldset class="settings">
                        <legend>Player-local MIDI</legend>
                        <p class="muted hint">Controller plugged into the player screen. Map here or on the player (press <b>m</b>). Active scene: set it in a workspace.</p>
                        <div class="midi-rows">
                            <template x-for="t in transportTargets" :key="t.cmd">
                                <div class="midi-row" @click="playerMidiLearn(pl,{type:'transport',cmd:t.cmd})" :title="'Learn: '+t.label"><button class="iconbtn" x-html="icon(t.icon)"></button><span class="mk" x-text="playerMidiKey(pl,{type:'transport',cmd:t.cmd})"></span></div>
                            </template>
                            <div class="midi-row" @click="playerMidiLearn(pl,{type:'blackout'})" title="Learn: Blackout"><button class="iconbtn">⬛</button><span class="mk" x-text="playerMidiKey(pl,{type:'blackout'})"></span></div>
                        </div>
                        <div class="midi-tiles">
                            <template x-for="f in (playerMidiMedia[pl.id]||[])" :key="f.name">
                                <div class="midi-tile" @click="playerMidiLearn(pl,{type:'media',name:f.name})"><img :src="f.thumb" loading="lazy"><span class="mk" x-text="playerMidiKey(pl,{type:'media',name:f.name})"></span></div>
                            </template>
                            <span class="muted" x-show="!(playerMidiMedia[pl.id]||[]).length">Set this player's active scene (in a workspace) to map its clips.</span>
                        </div>
                    </fieldset>
                </div>
            </section>
        </template>
        <p class="muted" x-show="players.length===0">No players yet.</p>
    </main>

    <!-- ===================== WORKSPACE ===================== -->
    <main x-show="view==='workspace' && project()" x-cloak>
        <template x-if="project()">
            <div>
                <div class="ws-head">
                    <button class="iconbtn" title="Back" @click="goProjects()" x-html="icon('back')"></button>
                    <h1 x-text="project().name"></h1>
                    <button class="iconbtn" title="Rename" @click="renameProject(project())" x-html="icon('pencil')"></button>
                    <span class="spacer"></span>
                    <button class="iconbtn danger" title="Delete project" @click="deleteProject(project())" x-html="icon('trash')"></button>
                </div>

                <!-- SCENES & MEDIA -->
                <section class="ws-scenes">
                    <div class="page-head">
                        <h2>Scenes &amp; media</h2>
                        <button @click="addScene(project())"><span x-html="icon('plus')"></span> Scene</button>
                    </div>
                    <div class="scenes" :data-scenes="project().id">
                        <template x-for="(s, idx) in project().sources" :key="s.id">
                            <div class="scene-card" :class="{dragging: isSceneDragging(project(),s)}" :data-sid="s.id" @dragover.prevent="sceneDragOver(project(),idx)" @drop.prevent>
                                <div class="sc-top">
                                    <span class="sidx" draggable="true" title="Drag to reorder" @dragstart="sceneDragStart(project(),idx,$event)" @dragend="sceneDragEnd(project())" x-text="pad(idx+1)"></span>
                                    <strong class="scene-name" x-text="s.name"></strong>
                                    <button class="iconbtn" title="Rename scene" @click="renameScene(project(),s)" x-html="icon('pencil')"></button>
                                    <span class="spacer"></span>
                                    <button class="iconbtn" title="Share" @click="openShare(dropUrl(s), project().name + ' / ' + s.name)" x-html="icon('share')"></button>
                                    <button class="iconbtn danger" title="Delete scene" @click="deleteScene(project(),s)" x-html="icon('trash')"></button>
                                </div>
                                <div class="sc-types">
                                    <button class="tchip" :class="{on: acceptAll(s)}" @click="setAcceptAll(project(),s)" title="Accept all">All</button>
                                    <button class="iconbtn tchip" :class="{on: s.accept && s.accept.image}" @click="toggleAccept(project(),s,'image')" title="Images" x-html="icon('image')"></button>
                                    <button class="iconbtn tchip" :class="{on: s.accept && s.accept.video}" @click="toggleAccept(project(),s,'video')" title="Videos" x-html="icon('video')"></button>
                                    <button class="iconbtn tchip" :class="{on: s.accept && s.accept.text}" @click="toggleAccept(project(),s,'text')" title="Text" x-html="icon('text')"></button>
                                    <button class="iconbtn tchip" :class="{on: s.accept && s.accept.stream}" @click="toggleAccept(project(),s,'stream')" title="Camera stream" x-html="icon('stream')"></button>
                                    <select class="streammode" x-show="s.accept && s.accept.stream" @change="setStreamMode(project(),s,$event.target.value)" title="When multiple streamers join">
                                        <option value="replace" :selected="s.streamMode!=='grid'">single</option>
                                        <option value="grid" :selected="s.streamMode==='grid'">grid</option>
                                    </select>
                                </div>
                                <button class="sc-media" @click="openMediaModal(project(),s)">
                                    <span x-html="icon('image')"></span>
                                    <span x-text="s.count + (s.count===1?' media':' medias')"></span>
                                    <span class="muted">· manage</span>
                                </button>
                            </div>
                        </template>
                        <p class="muted" x-show="project().sources.length===0">No scenes yet — add one.</p>
                    </div>
                </section>

                <!-- LIVE CONTROL ROOM -->
                <section class="control-room">
                    <div class="cr-head">
                        <h2>Live control</h2>
                        <button class="learn-toggle" :class="{on: consoleLearn}" @click="toggleConsoleLearn()">
                            <span x-html="icon('gear')"></span> <span x-text="consoleLearn ? 'MIDI learn — ON' : 'MIDI learn'"></span>
                        </button>
                        <span class="muted" x-text="midiPorts.length ? ('in: '+midiPorts.join(', ')) : ''"></span>
                        <label class="chk small"><input type="checkbox" x-model="autoScroll"> auto-scroll</label>
                        <span class="spacer"></span>
                        <select class="attach-sel" @change="attachPlayer(project(), $event.target.value); $event.target.value=''">
                            <option value="">+ attach player…</option>
                            <template x-for="pl in availablePlayers(project())" :key="pl.id"><option :value="pl.id" x-text="pl.name"></option></template>
                        </select>
                    </div>

                    <div class="cr-cols">
                        <template x-for="pl in attachedPlayers(project())" :key="pl.id">
                            <div class="cr-col">
                                <div class="cr-col-head">
                                    <strong x-text="pl.name"></strong>
                                    <button class="iconbtn" title="Open display" @click="openShare(playerUrl(pl), pl.name)" x-html="icon('share')"></button>
                                    <button class="iconbtn" title="Player settings" @click="goPlayerSettings(pl)" x-html="icon('gear')"></button>
                                    <button class="iconbtn danger" title="Detach" @click="detachPlayer(project(), pl)" x-html="icon('close')"></button>
                                </div>
                                <div class="cr-status" :class="statusClass(pl)" x-text="statusLabel(pl)"></div>
                                <div class="cr-transport">
                                    <button class="iconbtn ap" :class="{active: isAutoplaying(pl), learned: consoleKey(pl.id,{type:'autoplay'})}" title="Auto-play (diaporama)" @click="autoplay(pl)" x-html="icon('play')"></button>
                                    <button class="iconbtn" title="Restart" @click="transport(pl,'restart')" :class="{learned: consoleKey(pl.id,{type:'transport',cmd:'restart'})}" x-html="icon('restart')"></button>
                                    <button class="iconbtn" title="Prev" @click="transport(pl,'prev')" :class="{learned: consoleKey(pl.id,{type:'transport',cmd:'prev'})}" x-html="icon('prev')"></button>
                                    <button class="iconbtn" title="Pause" @click="transport(pl,'pause')" :class="{learned: consoleKey(pl.id,{type:'transport',cmd:'pause'})}" x-html="icon('pause')"></button>
                                    <button class="iconbtn" title="Next" @click="transport(pl,'next')" :class="{learned: consoleKey(pl.id,{type:'transport',cmd:'next'})}" x-html="icon('next')"></button>
                                    <button class="iconbtn" title="Stop (clear scene)" @click="stop(pl)" :class="{active: isStopped(pl), learned: consoleKey(pl.id,{type:'stop'})}" x-html="icon('stop')"></button>
                                    <button class="iconbtn" title="Blackout" @click="blackout(pl)" :class="{learned: consoleKey(pl.id,{type:'blackout'})}">⬛</button>
                                    <button class="iconbtn" title="Auto-play options" @click="toggleAutoplayOpts(pl)" x-html="icon('gear')"></button>
                                </div>
                                <div class="ap-opts" x-show="autoplayOpts[pl.id]" x-cloak>
                                    <label class="field inline"><span>Duration</span><input class="xnum" type="number" min="1" x-model.number="pl.settings.imageDuration" @change="saveSettings(pl)"></label>
                                    <label class="field inline"><span>Loop</span>
                                        <select x-model="pl.settings.loop" @change="saveSettings(pl)"><option value="all">all</option><option value="lastX">last X</option></select>
                                        <input class="xnum" type="number" min="1" x-show="pl.settings.loop==='lastX'" x-model.number="pl.settings.lastX" @change="saveSettings(pl)"></label>
                                    <label class="chk small"><input type="checkbox" x-model="pl.settings.prioritizeFresh" @change="saveSettings(pl)"> prioritise new uploads</label>
                                </div>
                                <div class="cr-scenes">
                                    <template x-for="s in project().sources" :key="s.id">
                                        <button class="scene-btn" :class="{active: isActiveScene(pl, project(), s), learned: consoleKey(pl.id,{type:'scene',sceneId:s.id})}" @click="playScene(project(), pl, s)">
                                            <span x-show="isActiveScene(pl, project(), s)">▸ </span><span x-text="s.name"></span>
                                            <span class="kbadge" x-show="consoleKey(pl.id,{type:'scene',sceneId:s.id})" x-text="consoleKey(pl.id,{type:'scene',sceneId:s.id})"></span>
                                        </button>
                                    </template>
                                </div>
                                <template x-if="activeSceneOf(project(), pl)">
                                    <div class="cr-clips" :data-cr-clips="pl.id">
                                        <template x-for="f in filesOf(activeSceneOf(project(), pl))" :key="f.name">
                                            <div class="cr-clip" :data-name="f.name" :class="{learned: consoleKey(pl.id,{type:'media',sceneId:activeSceneOf(project(),pl).id,name:f.name}), playing: isCurrentClip(pl, f)}" @click="playClip(project(), pl, activeSceneOf(project(),pl), f)">
                                                <img :src="f.thumb" loading="lazy">
                                                <span class="kbadge" x-show="consoleKey(pl.id,{type:'media',sceneId:activeSceneOf(project(),pl).id,name:f.name})" x-text="consoleKey(pl.id,{type:'media',sceneId:activeSceneOf(project(),pl).id,name:f.name})"></span>
                                            </div>
                                        </template>
                                        <span class="muted" x-show="!filesOf(activeSceneOf(project(), pl)).length">empty scene</span>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <p class="muted" x-show="attachedPlayers(project()).length===0">No players attached — use “+ attach player”.</p>
                    </div>
                    <p class="muted hint" x-show="consoleLearn">Click a scene / clip / transport / blackout, then press a MIDI pad to bind it for that player.</p>
                </section>
            </div>
        </template>
    </main>

    <!-- ===================== MEDIA MODAL ===================== -->
    <div class="modal" x-show="mediaModal.open" x-cloak @click="closeMediaModal()">
        <div class="modal-box media-box" @click.stop>
            <template x-for="s in (mediaModalScene() ? [mediaModalScene()] : [])" :key="s.id">
                <div>
                    <div class="media-box-head">
                        <strong class="scene-name" x-text="s.name"></strong>
                        <span class="count" x-text="s.count + (s.count===1?' file':' files')"></span>
                        <span class="spacer"></span>
                        <button class="iconbtn" title="Close" @click="closeMediaModal()" x-html="icon('close')"></button>
                    </div>
                    <div class="grid-tools">
                        <button @click="addMedia(project(),s)"><span x-html="icon('plus')"></span> Add media</button>
                        <label class="chk small"><input type="checkbox" :checked="s.allowSelfDelete" @change="toggleSelfDelete(project(),s)"> uploaders delete own</label>
                        <span class="muted" x-show="uploading[s.id]">uploading…</span>
                        <span class="spacer"></span>
                        <template x-if="selCount(s) > 0">
                            <span class="bulk">
                                <span class="muted" x-text="selCount(s)+' selected'"></span>
                                <button @click="bulk('archive',project(),s)"><span x-html="icon('archive')"></span> Archive</button>
                                <button class="danger" @click="bulk('delete',project(),s)"><span x-html="icon('trash')"></span> Delete</button>
                            </span>
                        </template>
                    </div>
                    <p class="muted hint" x-show="(files[s.id]||[]).length" x-text="selCount(s)>0 ? 'Click to select · drag to reorder' : 'Click to preview · drag to reorder'"></p>
                    <div class="grid" :data-grid="s.id">
                        <template x-for="(f, idx) in filesOf(s)" :key="f.name">
                            <div class="tile" :class="{sel: isSel(s,f.name), dragging: isDragging(s,f)}" :data-name="f.name" draggable="true"
                                 @dragstart="mediaDragStart(s,idx,$event)" @dragover.prevent="mediaDragOver(s,idx)" @drop.prevent @dragend="mediaDragEnd(project(),s)" @click="tileClick(s,idx)">
                                <input type="checkbox" class="tilechk" :checked="isSel(s,f.name)" @click.stop @change="toggleSel(s,f.name)">
                                <img :src="f.thumb" loading="lazy" alt="">
                                <span class="vbadge" x-show="f.type==='video'">▶</span>
                                <span class="vbadge" x-show="f.type==='text'">T</span>
                            </div>
                        </template>
                        <p class="muted" x-show="(files[s.id]||[]).length===0">Empty — add media or share the drop link.</p>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- ===================== SHARE MODAL ===================== -->
    <div class="modal" x-show="share.open" x-cloak @click="closeShare()">
        <div class="modal-box share-box" @click.stop>
            <h3 x-text="share.title"></h3>
            <img class="qr-big" :src="qrPng(share.url)" alt="QR">
            <p class="muted urlbreak" x-text="share.url"></p>
            <div class="row">
                <button @click="copyText(share.url)"><span x-html="icon('copy')"></span> Copy link</button>
                <a class="btn" :href="share.url" target="_blank"><span x-html="icon('open')"></span> Open</a>
                <button @click="copyImage(share.url)"><span x-html="icon('copy')"></span> Copy QR</button>
                <button @click="downloadImage(share.url, share.title)"><span x-html="icon('download')"></span> Download QR</button>
                <button @click="closeShare()">Close</button>
            </div>
        </div>
    </div>

    <!-- ===================== LIGHTBOX ===================== -->
    <div class="lb" x-show="lightbox.open" x-cloak @click="lbClose()">
        <button class="iconbtn lb-nav" @click.stop="lbPrev()" x-html="icon('left')"></button>
        <div class="lb-stage" @click.stop>
            <template x-if="lightbox.open && lbCurrent() && lbCurrent().type==='image'"><img :src="lbCurrent().url" alt=""></template>
            <template x-if="lightbox.open && lbCurrent() && lbCurrent().type==='video'"><video :src="lbCurrent().url" controls autoplay loop></video></template>
            <template x-if="lightbox.open && lbCurrent() && lbCurrent().type==='text'"><iframe class="lb-text" :src="lbCurrent().url" sandbox=""></iframe></template>
        </div>
        <button class="iconbtn lb-nav" @click.stop="lbNext()" x-html="icon('right')"></button>
        <button class="iconbtn lb-close" @click.stop="lbClose()" x-html="icon('close')"></button>
    </div>

</div>
</body>
</html>
