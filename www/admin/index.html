<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropfile · Admin</title>
    <link rel="stylesheet" href="/admin/admin.css">
    <script src="/admin/admin.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body>
<div id="app" x-data="adminApp()" x-init="init()"
     @keydown.window.arrow-right="lightbox.open && lbNext()"
     @keydown.window.arrow-left="lightbox.open && lbPrev()"
     @keydown.window.escape="lightbox.open ? lbClose() : (qr.open && closeQr())">

    <input type="file" multiple x-ref="fileInput" @change="onUpload($event)" style="display:none">

    <header class="topbar">
        <h1>Dropfile <span class="muted">media controller</span></h1>
        <nav class="tabs">
            <button :class="{active: tab==='projects'}" @click="tab='projects'">Projects</button>
            <button :class="{active: tab==='players'}" @click="tab='players'">Players</button>
        </nav>
    </header>

    <div class="toast" x-show="toast" x-text="toast" x-cloak></div>

    <!-- ===================== PROJECTS ===================== -->
    <main x-show="tab==='projects'" x-cloak>
        <div class="newrow">
            <input type="text" placeholder="New project name" x-model="newProjectName" @keydown.enter="createProject()">
            <button class="primary" @click="createProject()">+ Project</button>
        </div>

        <template x-for="p in projects" :key="p.id">
            <section class="card">
                <div class="card-head clickable" @click="collapseScenes(p)" title="Click to collapse all scenes">
                    <div class="title-wrap">
                        <h2 x-text="p.name"></h2>
                        <button class="iconbtn" title="Rename" @click.stop="renameProject(p)" x-html="icon('pencil')"></button>
                    </div>
                    <div class="actions">
                        <button @click.stop="addScene(p)"><span x-html="icon('plus')"></span> Scene</button>
                        <button class="iconbtn danger" title="Delete project" @click.stop="deleteProject(p)" x-html="icon('trash')"></button>
                    </div>
                </div>

                <div class="scenes" :data-scenes="p.id">
                    <template x-for="(s, idx) in p.sources" :key="s.id">
                        <div class="scene" :class="{dragging: isSceneDragging(p,s)}" :data-sid="s.id"
                             @dragover.prevent="sceneDragOver(p,idx)" @drop.prevent>
                            <div class="scene-head" @click="toggleExpand(p,s)">
                                <span class="sidx" draggable="true" title="Drag to reorder scenes"
                                      @click.stop @dragstart="sceneDragStart(p,idx,$event)" @dragend="sceneDragEnd(p)"
                                      x-text="pad(idx+1)"></span>
                                <strong class="scene-name" x-text="s.name"></strong>
                                <button class="iconbtn" title="Rename scene" @click.stop="renameScene(p,s)" x-html="icon('pencil')"></button>
                                <span class="spacer"></span>
                                <span class="count" x-text="s.count + (s.count===1 ? ' file' : ' files')"></span>
                                <button class="iconbtn chev" :class="{open: expanded[s.id]}" x-html="icon('down')"></button>
                                <button class="iconbtn danger" title="Delete scene" @click.stop="deleteScene(p,s)" x-html="icon('trash')"></button>
                            </div>

                            <div class="scene-row2">
                                <label class="switch c-toggle" @click.stop :title="s.public ? 'Public — has a drop URL' : 'Private — admin only'">
                                    <input type="checkbox" :checked="s.public" @change="toggleScenePublic(p,s)">
                                    <span class="slider"></span>
                                    <span class="switch-label" x-text="s.public ? 'public' : 'private'"></span>
                                </label>
                                <a class="url c-url" x-show="s.public" :href="dropUrl(s)" target="_blank" @click.stop x-text="dropUrl(s)"></a>
                                <button class="iconbtn c-copy" x-show="s.public" title="Copy link" @click.stop="copy(dropUrl(s))" x-html="icon('copy')"></button>
                                <button class="iconbtn c-qr" x-show="s.public" title="Show QR" @click.stop="openQr(dropUrl(s), p.name + ' / ' + s.name)" x-html="icon('qr')"></button>
                                <label class="chk small c-chk" x-show="s.public" @click.stop>
                                    <input type="checkbox" :checked="s.allowSelfDelete" @change="toggleSelfDelete(p,s)">
                                    uploaders delete own
                                </label>
                            </div>

                            <div class="scene-body" x-show="expanded[s.id]" x-cloak>
                                <div class="grid-tools">
                                    <button @click="addMedia(p,s)"><span x-html="icon('plus')"></span> Add media</button>
                                    <span class="muted" x-show="uploading[s.id]">uploading…</span>
                                    <span class="spacer"></span>
                                    <template x-if="selCount(s) > 0">
                                        <span class="bulk">
                                            <span class="muted" x-text="selCount(s) + ' selected'"></span>
                                            <button @click="bulk('archive',p,s)"><span x-html="icon('archive')"></span> Archive</button>
                                            <button class="danger" @click="bulk('delete',p,s)"><span x-html="icon('trash')"></span> Delete</button>
                                        </span>
                                    </template>
                                </div>

                                <p class="muted hint" x-show="(files[s.id]||[]).length"
                                   x-text="selCount(s) > 0 ? 'Click thumbnails to select · drag to reorder' : 'Click to preview · drag to reorder'"></p>

                                <div class="grid" :data-grid="s.id">
                                    <template x-for="(f, idx) in filesOf(s)" :key="f.name">
                                        <div class="tile" :class="{sel: isSel(s,f.name), dragging: isDragging(s,f)}"
                                             :data-name="f.name" draggable="true"
                                             @dragstart="mediaDragStart(s,idx,$event)" @dragover.prevent="mediaDragOver(s,idx)"
                                             @drop.prevent @dragend="mediaDragEnd(p,s)"
                                             @click="tileClick(s,idx)">
                                            <input type="checkbox" class="tilechk" :checked="isSel(s,f.name)" @click.stop @change="toggleSel(s,f.name)">
                                            <img :src="f.thumb" loading="lazy" alt="">
                                            <span class="vbadge" x-show="f.type==='video'">▶</span>
                                        </div>
                                    </template>
                                    <p class="muted" x-show="(files[s.id]||[]).length===0">Empty — add media or share the drop link.</p>
                                </div>
                            </div>
                        </div>
                    </template>
                    <p class="muted" x-show="p.sources.length===0">No scenes yet — add one.</p>
                </div>

                <div class="attached" x-show="players.length">
                    <span class="muted">Players:</span>
                    <template x-for="pl in players" :key="pl.id">
                        <label class="chk pill">
                            <input type="checkbox" :checked="isAttached(pl,p.id)" @change="toggleAttach(pl,p.id)">
                            <span x-text="pl.name"></span>
                        </label>
                    </template>
                </div>
            </section>
        </template>
        <p class="muted" x-show="projects.length===0">No projects yet.</p>
    </main>

    <!-- ===================== PLAYERS ===================== -->
    <main x-show="tab==='players'" x-cloak>
        <div class="newrow">
            <input type="text" placeholder="New player nickname" x-model="newPlayerName" @keydown.enter="createPlayer()">
            <button class="primary" @click="createPlayer()">+ Player</button>
        </div>

        <template x-for="pl in players" :key="pl.id">
            <section class="card">
                <div class="card-head">
                    <div class="title-wrap">
                        <h2 x-text="pl.name"></h2>
                        <button class="iconbtn" title="Rename" @click="renamePlayer(pl)" x-html="icon('pencil')"></button>
                    </div>
                    <div class="actions">
                        <button class="iconbtn danger" title="Delete player" @click="deletePlayer(pl)" x-html="icon('trash')"></button>
                    </div>
                </div>

                <div class="player-grid">
                    <div class="player-share">
                        <img class="qr" :src="qrPng(playerUrl(pl))" alt="QR" @click="openQr(playerUrl(pl), pl.name)">
                        <a :href="playerUrl(pl)" target="_blank" x-text="playerUrl(pl)"></a>
                        <button @click="copy(playerUrl(pl))"><span x-html="icon('copy')"></span> Copy link</button>
                    </div>

                    <div class="player-config">
                        <label class="field">
                            <span>Attached projects</span>
                            <div class="attach-list">
                                <template x-for="p in projects" :key="p.id">
                                    <label class="chk pill">
                                        <input type="checkbox" :checked="isAttached(pl,p.id)" @change="toggleAttach(pl,p.id)">
                                        <span x-text="p.name"></span>
                                    </label>
                                </template>
                                <span class="muted" x-show="projects.length===0">Create a project first.</span>
                            </div>
                        </label>

                        <label class="field">
                            <span>Active source</span>
                            <select @change="setActive(pl, $event.target.value)">
                                <option value="" :selected="activeKey(pl)===''">— none —</option>
                                <template x-for="opt in sourcesFor(pl)" :key="opt.key">
                                    <option :value="opt.key" :selected="activeKey(pl)===opt.key" x-text="opt.label"></option>
                                </template>
                            </select>
                        </label>

                        <fieldset class="settings">
                            <legend>Playback</legend>
                            <label class="field inline">
                                <span>Mode</span>
                                <select x-model="pl.settings.playMode" @change="saveSettings(pl)">
                                    <option value="diaporama">diaporama (auto)</option>
                                    <option value="manual">manual (keypress)</option>
                                </select>
                            </label>
                            <label class="field inline">
                                <span>Image duration (s)</span>
                                <input type="number" min="1" step="1" x-model.number="pl.settings.imageDuration" @change="saveSettings(pl)">
                            </label>
                            <label class="field inline">
                                <span>Loop</span>
                                <select x-model="pl.settings.loop" @change="saveSettings(pl)">
                                    <option value="all">all media</option>
                                    <option value="lastX">last X uploaded</option>
                                </select>
                            </label>
                            <label class="field inline" x-show="pl.settings.loop==='lastX'">
                                <span>X</span>
                                <input type="number" min="1" step="1" x-model.number="pl.settings.lastX" @change="saveSettings(pl)">
                            </label>
                            <label class="chk">
                                <input type="checkbox" x-model="pl.settings.prioritizeFresh" @change="saveSettings(pl)">
                                prioritise fresh uploads
                            </label>
                        </fieldset>

                        <fieldset class="settings">
                            <legend>Surface / LED scaler</legend>
                            <label class="field inline">
                                <span>Container</span>
                                <select x-model="pl.settings.scaler.container" @change="saveSettings(pl)">
                                    <option value="full">full screen</option>
                                    <option value="custom">custom resolution</option>
                                </select>
                            </label>
                            <div class="row" x-show="pl.settings.scaler.container==='custom'">
                                <label class="field inline"><span>W</span>
                                    <input type="number" min="0" x-model.number="pl.settings.scaler.width" @change="saveSettings(pl)"></label>
                                <label class="field inline"><span>H</span>
                                    <input type="number" min="0" x-model.number="pl.settings.scaler.height" @change="saveSettings(pl)"></label>
                            </div>
                            <label class="field inline">
                                <span>Fit</span>
                                <select x-model="pl.settings.scaler.fit" @change="saveSettings(pl)">
                                    <option value="contain">contain</option>
                                    <option value="cover">cover</option>
                                </select>
                            </label>
                            <div class="row">
                                <label class="field inline"><span>H pos</span>
                                    <select x-model="pl.settings.scaler.hPosition" @change="saveSettings(pl)">
                                        <option value="center">center</option><option value="left">left</option>
                                        <option value="right">right</option><option value="custom">custom</option>
                                    </select></label>
                                <label class="field inline" x-show="pl.settings.scaler.hPosition==='custom'"><span>dx</span>
                                    <input type="number" x-model.number="pl.settings.scaler.hOffset" @change="saveSettings(pl)"></label>
                            </div>
                            <div class="row">
                                <label class="field inline"><span>V pos</span>
                                    <select x-model="pl.settings.scaler.vPosition" @change="saveSettings(pl)">
                                        <option value="center">center</option><option value="top">top</option>
                                        <option value="bottom">bottom</option><option value="custom">custom</option>
                                    </select></label>
                                <label class="field inline" x-show="pl.settings.scaler.vPosition==='custom'"><span>dy</span>
                                    <input type="number" x-model.number="pl.settings.scaler.vOffset" @change="saveSettings(pl)"></label>
                            </div>
                            <label class="field inline">
                                <span>Rotation</span>
                                <select x-model.number="pl.settings.scaler.rotation" @change="saveSettings(pl)">
                                    <option :value="0">0°</option><option :value="90">90°</option>
                                    <option :value="180">180°</option><option :value="270">270°</option>
                                </select>
                            </label>
                            <label class="chk">
                                <input type="checkbox" x-model="pl.settings.scaler.evenLineSuppression" @change="saveSettings(pl)">
                                even-line suppression (semi-transparent LED)
                            </label>
                        </fieldset>
                    </div>
                </div>
            </section>
        </template>
        <p class="muted" x-show="players.length===0">No players yet.</p>
    </main>

    <!-- ===================== LIGHTBOX ===================== -->
    <div class="lb" x-show="lightbox.open" x-cloak @click="lbClose()">
        <button class="iconbtn lb-nav" @click.stop="lbPrev()" x-html="icon('left')"></button>
        <div class="lb-stage" @click.stop>
            <template x-if="lbCurrent() && lbCurrent().type==='image'">
                <img :src="lbCurrent().url" alt="">
            </template>
            <template x-if="lbCurrent() && lbCurrent().type==='video'">
                <video :src="lbCurrent().url" controls autoplay loop></video>
            </template>
        </div>
        <button class="iconbtn lb-nav" @click.stop="lbNext()" x-html="icon('right')"></button>
        <button class="iconbtn lb-close" @click.stop="lbClose()" x-html="icon('close')"></button>
    </div>

    <!-- ===================== QR MODAL ===================== -->
    <div class="modal" x-show="qr.open" x-cloak @click="closeQr()">
        <div class="modal-box qr-box" @click.stop>
            <h3 x-text="qr.title"></h3>
            <img class="qr-big" :src="qrPng(qr.url)" alt="QR">
            <p class="muted urlbreak" x-text="qr.url"></p>
            <div class="row">
                <button @click="copyQrImage()"><span x-html="icon('copy')"></span> Copy image</button>
                <button @click="downloadQr()"><span x-html="icon('download')"></span> Download</button>
                <button @click="closeQr()">Close</button>
            </div>
        </div>
    </div>

</div>
</body>
</html>
