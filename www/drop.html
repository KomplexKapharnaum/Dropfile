<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KXKM</title>
    <link rel="stylesheet" href="/drop.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="/camera.js"></script>
</head>
<body>
    <header class="chat-head">
        <div class="titles">
            <div class="ch-title">KXKM</div>
            <div id="sub" class="ch-sub"></div>
        </div>
        <button id="nickBtn" class="nick">👤 <span id="nickName">…</span> ✎</button>
    </header>

    <div id="timeline" class="timeline"></div>

    <form id="composer" class="composer">
        <button type="button" id="attachBtn" class="cbtn icon" title="Send photo / video">＋</button>
        <input type="file" id="fileInput" accept="image/*,video/*" multiple hidden>
        <input type="text" id="textInput" class="ctext" placeholder="Message…" autocomplete="off">
        <button type="button" id="liveBtn" class="cbtn live icon hidden" title="Go live">●</button>
        <button type="submit" id="sendBtn" class="cbtn send">Send</button>
    </form>

    <div id="nickModal" class="nick-modal hidden">
        <div class="nm-box">
            <h3>Your name</h3>
            <input id="nickField" type="text" maxlength="20" placeholder="e.g. Alex" autocomplete="off">
            <button id="nickSave" class="primary">OK</button>
        </div>
    </div>

    <div id="camOverlay" class="cam-overlay hidden">
        <video id="camPreview" autoplay muted playsinline></video>
        <div class="cam-top">
            <span class="cam-live">● LIVE</span>
            <span id="camStatus" class="cam-status">starting…</span>
        </div>
        <div class="cam-bar">
            <button id="camFlip">↺ Flip camera</button>
            <button id="camStop" class="stop">■ Stop</button>
        </div>
    </div>

    <script src="/drop.js"></script>
</body>
</html>
