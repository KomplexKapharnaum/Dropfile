# ============================================================================
#  coturn — STUN + TURN for Dropfile WebRTC (Phase 2 camera)
#  Runs on MACHINE A (public-facing box, side-by-side with nginx).
#
#  Install & deploy:
#    sudo apt install coturn
#    sudo sed -i 's/^#TURNSERVER_ENABLED=1/TURNSERVER_ENABLED=1/' /etc/default/coturn
#    sudo cp extra/turnserver.conf /etc/turnserver.conf   # then fill the <PLACEHOLDERS>
#    sudo systemctl enable --now coturn
#
#  coturn and nginx do not conflict: nginx owns 80/443, coturn owns 3478/5349
#  plus the UDP relay range below.
# ============================================================================

# --- listening ports ---------------------------------------------------------
listening-port=3478           # STUN + TURN, plain (udp & tcp)
tls-listening-port=5349       # STUN + TURN over TLS / DTLS

# --- public / NAT mapping ----------------------------------------------------
# The router forwards all ports to machine A, so A's NIC holds a PRIVATE address
# while clients reach it via the PUBLIC address (1:1 port-forward NAT). Advertise
# the public IP and map it to A's local relay IP:
#     external-ip=<PUBLIC_IP>/<MACHINE_A_LOCAL_IP>
external-ip=<PUBLIC_IP>/<MACHINE_A_LOCAL_IP>

# Pin listening / relay to A's LAN interface (optional — omit to use all NICs):
#listening-ip=<MACHINE_A_LOCAL_IP>
#relay-ip=<MACHINE_A_LOCAL_IP>

# --- relay UDP port range (open the SAME range in the firewall) --------------
min-port=49152
max-port=49300

# --- authentication: time-limited credentials (TURN REST API) ----------------
# The Dropfile node app (lib/turn.js) signs short-lived credentials with the
# SAME secret — keep static-auth-secret identical to TURN_SECRET in the app .env.
use-auth-secret
static-auth-secret=<LONG_RANDOM_HEX>      # generate with: openssl rand -hex 32
realm=<TURN_HOST>                          # e.g. turn.dropfile.example

# --- TLS (for turns:5349) ----------------------------------------------------
# Issue a cert on machine A with certbot for <TURN_HOST>, and reload coturn on
# renewal:   certbot ... --deploy-hook "systemctl restart coturn"
cert=/etc/letsencrypt/live/<TURN_HOST>/fullchain.pem
pkey=/etc/letsencrypt/live/<TURN_HOST>/privkey.pem
#dh-file=/etc/coturn/dhparam.pem          # optional: openssl dhparam -out ... 2048

# --- hardening ---------------------------------------------------------------
fingerprint                   # WebRTC expects FINGERPRINT on messages
no-cli                        # disable the telnet admin interface
no-tlsv1
no-tlsv1_1
no-multicast-peers
# Stop the relay being abused to reach loopback / the LAN / link-local:
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# --- abuse limits (tune for a small collective; comment out to disable) ------
#total-quota=100              # max simultaneous allocations, server-wide
#user-quota=12                # max simultaneous allocations per credential
#bps-capacity=0               # 0 = no cap on total relay bandwidth

# --- logging -----------------------------------------------------------------
log-file=/var/log/turnserver/turnserver.log
simple-log
#verbose                      # uncomment while debugging ICE
